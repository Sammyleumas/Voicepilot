name: Build VoicePilot app

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: voicepilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Core tests, debug APK, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core engine tests (JVM)
        run: ./gradlew --no-daemon coreTest

      - name: Assemble debug APK
        # Each CI build gets a higher versionCode so a new APK installs over the previous one.
        run: ./gradlew --no-daemon :app:assembleDebug -PVERSION_CODE=${{ github.run_number }}

      - name: App unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voicepilot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voicepilot-reports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore

  publish:
    name: Publish installable APK (GitHub Release)
    runs-on: ubuntu-latest
    # Only publish when unit tests, lint and the emulator tests all passed.
    needs: [build, instrumented]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voicepilot-debug-apk
          path: apk

      - name: Name the APK
        run: |
          set -e
          src=$(ls apk/*.apk | head -n 1)
          mv "$src" "SL-build-${{ github.run_number }}.apk"
          ls -l *.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voicepilot-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SL — test build ${{ github.run_number }}
          make_latest: true
          files: SL-build-${{ github.run_number }}.apk
          body: |
            Installable test build of SL (formerly VoicePilot AI) (Android 10 or newer).

            **Install on your phone**
            1. Open this page on your Android phone and tap **SL-build-${{ github.run_number }}.apk** below.
            2. When Android asks, allow your browser to install unknown apps.
            3. Open the downloaded file and tap **Install**. Newer builds install over older ones.

            This is a debug-signed test build (package `com.voicepilot.ai.debug`), not a Play Store release.
            All automated checks for commit ${{ github.sha }} passed before this file was published.

  instrumented:
    name: Instrumented tests (emulator, API 30)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voicepilot-instrumented-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
